[project]
name = "fde-exam-gen"
version = "0.1.0"
description = "FDE course PDF → question bank generator"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.26.0",
  "pydantic>=2.10.0",
  "typer>=0.15.0",
  "openai>=1.60.0",
  "rapidfuzz>=3.10.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
fde-gen = "fde_exam_gen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fde_exam_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
